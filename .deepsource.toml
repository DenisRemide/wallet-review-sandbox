version = 1

test_patterns = ["src/**/*.spec.ts"]

exclude_patterns = [
  "node_modules/**",
  "dist/**",
  "coverage/**",
]

[[analyzers]]
name = "javascript"
enabled = true

[analyzers.meta]
plugins = ["typescript"]
environment = ["nodejs", "jest"]

[[analyzers]]
name = "secrets"
enabled = true

[[analyzers]]
name = "test-coverage"
enabled = false
